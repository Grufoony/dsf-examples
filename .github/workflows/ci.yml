name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly: keeps the OpenStreetMap cache alive and catches upstream changes
    - cron: "0 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .

  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked

      - name: Cache month
        id: month
        run: echo "value=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      # The osmnx cache of the OpenStreetMap queries, refreshed every month
      - uses: actions/cache@v4
        with:
          path: 0_cartography/cache
          key: osm-${{ hashFiles('0_cartography/cartography.py', 'uv.lock') }}-${{ steps.month.outputs.value }}
          restore-keys: |
            osm-${{ hashFiles('0_cartography/cartography.py', 'uv.lock') }}-

      - name: Run the examples
        run: uv run ci/examples.py run
      - name: Check the results
        run: uv run ci/examples.py check
      - name: Build the website
        run: uv run ci/examples.py site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [lint, examples]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
